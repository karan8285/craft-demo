  :root { color-scheme: light; }

  input { width: 100%; padding: 11px 12px; border: 1px solid #2a3a5a; border-radius: 7px; background: #0b1222; color: #f6f7f6; font: inherit; }
  input:focus { outline: 2px solid #0e7fa0; outline-offset: 1px; }
  button { width: 100%; margin-top: 14px; padding: 11px; border: 0; border-radius: 7px; background: #0e7490; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { background: #0a5a72; }
  button:disabled { opacity: .6; cursor: default; }
  .err { color: #f0a8a2; font-size: 13px; margin-top: 12px; min-height: 18px; }
  .note { color: #8089a3; font-size: 11.5px; margin-top: 16px; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #eef1f6; }
</style></head>
